[project]
name = "social-mcp"
version = "0.1.0"
description = "Self-hosted MCP server: upload videos to YouTube, Instagram Reels and Google Drive with your own API credentials"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.3,<3",
  "google-api-python-client>=2.202",
  "google-auth-oauthlib>=1.5",
  "httpx>=0.28",
]

[project.scripts]
social-mcp = "social_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/social_mcp"]
